<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NV001 Dashboard</title>
    <style>
        body { 
            background-color: #0f111a; 
            color: #e0e0e0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            display: grid; 
            grid-template-columns: 2fr 1fr; 
            grid-template-rows: 1fr 1fr; 
            height: 100vh; 
            gap: 15px; 
            padding: 15px; 
            box-sizing: border-box; 
        }
        .panel { 
            background-color: #1a1d27; 
            border: 1px solid #2a2e3d; 
            border-radius: 8px; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .panel h2 { 
            margin-top: 0; 
            font-size: 13px; 
            color: #8f9bb3; 
            text-transform: uppercase; 
            border-bottom: 1px solid #2a2e3d; 
            padding-bottom: 8px; 
            letter-spacing: 1px;
        }
        #terminal { grid-row: 1 / 3; grid-column: 1 / 2; }
        #tasks-panel { grid-row: 1 / 2; grid-column: 2 / 3; }
        #memory-panel { grid-row: 2 / 3; grid-column: 2 / 3; }
        
        #output { 
            flex-grow: 1; 
            overflow-y: auto; 
            font-family: 'Consolas', 'Courier New', monospace; 
            font-size: 13px; 
            color: #00ff9d; 
            white-space: pre-wrap; 
            margin-bottom: 15px; 
            padding: 10px;
            background: #151722;
            border-radius: 6px;
        }
        #input-container { display: flex; gap: 10px; }
        #cmd-input { 
            flex-grow: 1; 
            background: #222634; 
            color: white; 
            border: 1px solid #3b4252; 
            padding: 12px; 
            font-family: 'Consolas', monospace; 
            border-radius: 6px; 
            outline: none; 
            transition: border-color 0.2s;
        }
        #cmd-input:focus { border-color: #00ff9d; }
        button { 
            background: #3b4252; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            cursor: pointer; 
            border-radius: 6px; 
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #4c566a; }
        
        .list-item { 
            font-size: 12px; 
            margin-bottom: 10px; 
            padding: 10px; 
            background: #222634; 
            border-left: 4px solid #4c566a; 
            border-radius: 4px;
        }
        .status-running { border-left-color: #ebcb8b; }
        .status-completed { border-left-color: #a3be8c; }
        .status-failed { border-left-color: #bf616a; }
        .cmd-text { color: #d8dee9; font-weight: bold; margin-bottom: 4px; display: block;}
        .meta-text { color: #8f9bb3; font-size: 10px;}
    </style>
</head>
<body>
    <div id="terminal" class="panel">
        <h2>Terminal / Command Interface</h2>
        <div id="output"></div>
        <div id="input-container">
            <input type="text" id="cmd-input" placeholder="Enter command or goal..." autofocus>
            <button onclick="sendCommand()">Execute</button>
        </div>
    </div>
    
    <div id="tasks-panel" class="panel">
        <h2>Active Task Queue (Live)</h2>
        <div id="tasks-list" style="overflow-y: auto;">
            <div style="color: #8f9bb3; font-size: 12px; font-style: italic;">No tasks running...</div>
        </div>
    </div>
    
    <div id="memory-panel" class="panel">
        <h2>Procedural Memory (Recent History)</h2>
        <div id="memory-list" style="overflow-y: auto;">
            <div style="color: #8f9bb3; font-size: 12px; font-style: italic;">Memory empty...</div>
        </div>
    </div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        const output = document.getElementById("output");
        const input = document.getElementById("cmd-input");
        const tasksList = document.getElementById("tasks-list");
        const memoryList = document.getElementById("memory-list");

        ws.onmessage = function(event) {
            const msg = JSON.parse(event.data);
            if (msg.type === "log") {
                output.textContent += msg.content + "\n";
                output.scrollTop = output.scrollHeight;
            } else if (msg.type === "tasks_update") {
                renderTasks(msg.content);
            } else if (msg.type === "memory_update") {
                renderMemory(msg.content);
            }
        };

        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") sendCommand();
        });

        function sendCommand() {
            const cmd = input.value;
            if (cmd.trim() === "") return;
            ws.send(JSON.stringify({type: "command", content: cmd}));
            input.value = "";
        }

        function renderTasks(tasks) {
            if (tasks.length === 0) return;
            tasksList.innerHTML = tasks.reverse().map(t => 
                `<div class="list-item status-${t.status}">
                    <span class="cmd-text">${t.cmd}</span>
                    <span class="meta-text">ID: ${t.id} | STATUS: ${t.status.toUpperCase()}</span>
                </div>`
            ).join("");
        }

        function renderMemory(history) {
            if (history.length === 0) return;
            memoryList.innerHTML = history.reverse().map(h => 
                `<div class="list-item status-${h.status}">
                    <span class="cmd-text">${h.command}</span>
                    <span class="meta-text">ID: ${h.task_id} | STATUS: ${h.status.toUpperCase()}</span>
                </div>`
            ).join("");
        }
    </script>
</body>
</html>
